# CI 用 Node 22 + pnpm。Astro 要求 Node >=22.12.0，undici 要求 >=22.19.0。
# pnpm-workspace.yaml 的 allowBuilds 是 pnpm 10 的設定。
[tools]
node = "22.19"
pnpm = "10.34.9"

[tasks]
install = "pnpm install --frozen-lockfile"
dev = "pnpm dev"
build = "pnpm build"
check = "pnpm check"
preview = "pnpm preview"
validate = "pnpm validate:content"
